<app-hero />

<section class="py-20 sm:py-28">
  <div class="container-page">
    <div class="flex flex-wrap items-end justify-between gap-4" [appReveal]="0">
      <div>
        <p class="font-serif text-sm italic text-ink-500">Only three, kept simple</p>
        <h2 class="mt-2 text-3xl font-extrabold tracking-tight text-ink-950 sm:text-4xl">Shop the lineup</h2>
      </div>
      <a routerLink="/products" class="text-sm font-bold text-accent-700 hover:text-accent-800">Shop all plans →</a>
    </div>

    <div class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
      @for (product of products; track product.id; let i = $index) {
        <div [appReveal]="i * 80">
          <app-product-card [product]="product" />
        </div>
      }
    </div>
  </div>
</section>

<app-order-counter />
<app-how-it-works />
