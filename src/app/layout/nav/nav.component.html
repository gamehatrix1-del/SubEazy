<header class="fixed inset-x-0 top-0 z-50 border-b border-ink-900/8 bg-cream/85 backdrop-blur-md">
  <nav class="container-page flex h-16 items-center justify-between">
    <a routerLink="/">
      <app-brand-logo />
    </a>

    <ul class="hidden items-center gap-8 md:flex">
      @for (link of links; track link.path + (link.fragment ?? '')) {
        <li>
          <a
            [routerLink]="link.path"
            [fragment]="link.fragment ?? undefined"
            class="text-sm font-semibold text-ink-600 transition-colors duration-200 hover:text-accent-600"
            >{{ link.label }}</a
          >
        </li>
      }
    </ul>

    <div class="hidden md:block">
      <a
        [href]="whatsappLink"
        target="_blank"
        rel="noopener"
        (click)="onWhatsappClick()"
        class="inline-flex items-center gap-2 rounded-full bg-whatsapp px-5 py-2.5 text-sm font-bold text-white shadow-md shadow-whatsapp/20 transition-transform duration-200 ease-[cubic-bezier(0.4,0,0.2,1)] hover:scale-[1.02] active:scale-[0.98]"
      >
        Chat on WhatsApp
      </a>
    </div>

    <button
      type="button"
      class="flex h-10 w-10 items-center justify-center rounded-lg text-ink-800 md:hidden"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Toggle menu"
    >
      @if (!menuOpen()) {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      } @else {
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" d="M6 6l12 12M18 6L6 18" />
        </svg>
      }
    </button>
  </nav>

  @if (menuOpen()) {
    <div class="border-t border-ink-900/8 bg-cream/98 px-5 pb-6 pt-2 md:hidden">
      <ul class="flex flex-col gap-1">
        @for (link of links; track link.path + (link.fragment ?? '')) {
          <li>
            <a
              [routerLink]="link.path"
              [fragment]="link.fragment ?? undefined"
              (click)="closeMenu()"
              class="block rounded-lg px-2 py-3 text-base font-semibold text-ink-800 hover:bg-ink-900/5"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
      <a
        [href]="whatsappLink"
        target="_blank"
        rel="noopener"
        (click)="onWhatsappClick(); closeMenu()"
        class="mt-4 flex items-center justify-center rounded-full bg-whatsapp px-5 py-3 text-sm font-bold text-white"
      >
        Chat on WhatsApp
      </a>
    </div>
  }
</header>
