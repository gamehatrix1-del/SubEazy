<div
  class="fixed inset-x-0 bottom-0 z-40 flex items-center justify-between gap-3 border-t border-ink-900/10 bg-white/95 px-4 py-3 shadow-[0_-4px_16px_rgba(29,26,21,0.08)] backdrop-blur-md md:hidden"
  style="padding-bottom: max(0.75rem, env(safe-area-inset-bottom))"
>
  <div class="min-w-0">
    <p class="text-[11px] font-semibold uppercase tracking-wide text-ink-500">Genuine subs, up to 90% off</p>
    <p class="text-sm font-bold text-ink-950">Plans from ₹{{ startingPrice }}</p>
  </div>
  <a
    [href]="whatsappLink"
    target="_blank"
    rel="noopener"
    (click)="onWhatsappClick()"
    class="inline-flex shrink-0 items-center gap-1.5 rounded-full bg-whatsapp px-4 py-2.5 text-sm font-bold text-white shadow-md shadow-whatsapp/25 transition-transform duration-200 ease-[cubic-bezier(0.4,0,0.2,1)] active:scale-95"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path
        d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.33 5L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2Z"
      />
    </svg>
    Chat now
  </a>
</div>
